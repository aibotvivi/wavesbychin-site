# Rebuilds the pre-rendered pages whenever the source changes, so an edit made anywhere
# (GitHub's web editor, phone, another AI tool) reaches search engines without anyone
# running `node scripts/build-pages.mjs` by hand. If nothing changed, it commits nothing.
name: Build pages

on:
  push:
    branches: [main]
    paths:
      - app.js
      - config.js
      - template.html
      - scripts/build-pages.mjs
      - index.html
      - "*/index.html"
      - sitemap.xml
      - robots.txt
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node scripts/build-pages.mjs

      - name: Commit regenerated pages
        run: |
          git add -A index.html '*/index.html' sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Pages already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild pages from app.js / template.html"
          # Someone may have pushed again while this ran.
          git pull --rebase origin main
          git push origin HEAD:main
